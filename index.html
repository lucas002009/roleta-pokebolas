<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roleta de brindes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1226;
    --bg2: #1b1f45;
    --text: #f4f4ff;
    --muted: #a7abd6;
    --poke: #e53935;
    --great: #1e88e5;
    --gold: #f5b400;
    --card: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg) 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 16px 18px;
    overflow-x: hidden;
  }
  h1 { margin: 0 0 2px; font-size: clamp(22px, 4vh, 40px); line-height: 1.1; letter-spacing: .5px; }

  .sub { margin: 0 0 24px; font-size: clamp(14px, 2.4vh, 20px); text-shadow: 0 2px 6px #000; }
  .sub b { color: #f5b400; }
  h1 { text-shadow: 0 2px 8px #000; }
  .stage { position: relative; width: min(94vw, calc(100vh - 260px)); min-width: 260px; aspect-ratio: 1; }
  .pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 3;
    border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-top: 34px solid #fff;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.5));
  }
  /* A sombra fica num elemento parado: a camada que gira contém só a roda */
  .stage::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 10px #2a2f66, 0 0 0 14px #fff2, 0 20px 60px rgba(0,0,0,.6);
  }
  #wheel {
    display: block; position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    transform: rotate(0deg);
  }
  /* Só durante o giro: a roda vira uma textura na GPU e não é redesenhada a cada quadro */
  #wheel.spinning { will-change: transform; }
  .hub {
    position: absolute; inset: 0; margin: auto; width: 22%; height: 22%;
    border-radius: 50%; z-index: 2; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff, #d9dbf5 60%, #9aa0d8);
    color: #1b1f45; font: 700 clamp(14px, 3.6vw, 20px) "Fredoka", sans-serif;
    box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 -4px 0 rgba(0,0,0,.15);
    transition: transform .15s;
  }
  .hub:hover:not(:disabled) { transform: scale(1.06); }
  .hub:disabled { cursor: default; opacity: .85; }

  /* Resultado */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,6,20,.86);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .result {
    background: linear-gradient(160deg, #262b63, #151937); border-radius: 24px;
    padding: 28px 32px; text-align: center; width: min(340px, 90vw);
    transform: scale(.7); transition: transform .35s cubic-bezier(.2,1.6,.4,1);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .overlay.show .result { transform: scale(1); }
  /* Animação de captura: a bola cai, quica, balança 3 vezes com o botão piscando e trava com estrelas */
  #resultBall { position: relative; width: 120px; height: 120px; margin: 0 auto; }
  .ball {
    position: absolute; inset: 0; transform-origin: 50% 92%; will-change: transform;
    animation: drop .7s cubic-bezier(.3,0,.6,1), shake 2.7s .8s ease-in-out;
  }
  .ball svg { display: block; width: 120px; height: 120px; }
  /* Luz do botão: elemento à parte animando só opacidade (não redesenha o SVG) */
  .ball .core {
    position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: #ff5252; opacity: 0;
    animation: blink .9s .8s 3;
  }
  @keyframes drop {
    0%   { transform: translateY(-320px) rotate(-360deg); }
    55%  { transform: translateY(0) rotate(0); }
    72%  { transform: translateY(-34px); }
    86%  { transform: translateY(0); }
    93%  { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }
  @keyframes shake {
    0%, 12%, 33%, 45%, 66%, 78%, 100% { transform: rotate(0); }
    4%, 37%, 70% { transform: rotate(-24deg); }
    8%, 41%, 74% { transform: rotate(20deg); }
  }
  @keyframes blink { 0%, 45%, 100% { opacity: 0; } 10%, 30% { opacity: 1; } }
  .result.caught .ball { animation: click .35s ease-out; }
  @keyframes click { 0% { transform: scale(1); } 40% { transform: scale(.88); filter: brightness(.6); } 100% { transform: scale(1); } }
  .result.caught .core { animation: none; background: #ffe082; opacity: 1; }

  .star {
    position: absolute; left: 50%; top: 35%; font-size: 22px; color: #ffd740; opacity: 0;
    text-shadow: 0 0 8px #ffb300; pointer-events: none;
  }
  .result.caught .star { animation: star .9s ease-out forwards; }
  .star:nth-child(2) { --x: -70px; }
  .star:nth-child(3) { --x: 0px; --y: -85px; }
  .star:nth-child(4) { --x: 70px; }
  @keyframes star {
    0%   { opacity: 1; transform: translate(-50%, 0) scale(.3); }
    60%  { opacity: 1; transform: translate(calc(-50% + var(--x, 0px)), var(--y, -60px)) scale(1.2) rotate(180deg); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x, 0px) * 1.3), calc(var(--y, -60px) + 30px)) scale(.6) rotate(360deg); }
  }

  .result h2, .result p, .result button { opacity: 0; transition: opacity .3s; }
  .result.caught h2, .result.caught p, .result.caught button { opacity: 1; }
  .result h2 { margin: 12px 0 4px; font-size: 28px; }
  .result p { margin: 0 0 18px; color: var(--muted); }
  .result p b { display: block; margin-top: 6px; color: var(--text); font-size: 44px; line-height: 1; }
  .result button {
    background: #fff; color: #1b1f45; border: none; border-radius: 12px;
    padding: 10px 22px; font: 700 16px "Fredoka", sans-serif; cursor: pointer;
  }
  .result.gold { box-shadow: 0 0 0 3px var(--gold), 0 0 60px rgba(245,180,0,.6); }

  .mute {
    position: fixed; top: 10px; right: 10px; z-index: 12; width: 44px; height: 44px;
    border: none; border-radius: 50%; background: var(--card); color: var(--text);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 11; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .ball, .ball .core, .result.caught .star { animation: none; }
  }
</style>
</head>
<body>
  <h1>Roleta de brindes</h1>
  <p class="sub">Nos siga nas redes sociais <b>@basedoheroi</b></p>

  <div class="stage">
    <div class="pointer" id="pointer"></div>
    <svg id="wheel" viewBox="-200 -200 400 400"></svg>
    <button class="hub" id="spin">GIRAR</button>
  </div>


  <div class="overlay" id="overlay">
    <div class="result" id="result">
      <div id="resultBall"></div>
      <h2 id="resultName"></h2>
      <p id="resultText"></p>
      <button id="again">Girar de novo</button>
    </div>
  </div>
  <canvas id="confetti" hidden></canvas>
  <button class="mute" id="mute" aria-label="Ligar ou desligar o som">🔊</button>

<script>
  const PRIZES = {
    poke:  { name: "Pokéball",  chance: 70, cards: 100, top: "#e53935", dark: "#b71c1c", slice: "#c62828", slice2: "#a31f1f" },
    great: { name: "Greatball", chance: 25, cards: 100, top: "#1e88e5", dark: "#0d47a1", slice: "#1565c0", slice2: "#0f4f99" },
    gold:  { name: "Goldball",  chance: 5,  cards: 50,  top: "#f5b400", dark: "#b37f00", slice: "#e0a200", slice2: "#e0a200" },
  };

  // 18 fatias, 6 de cada bola: a roda é só visual e não revela as chances (o sorteio usa PRIZES.chance)
  const SEGMENTS = Array.from({ length: 18 }, (_, i) => ["poke", "great", "gold"][i % 3]);
  const SEG_ANGLE = 360 / SEGMENTS.length;

  function ballSVG(type, cx = 0, cy = 0, r = 50) {
    const p = PRIZES[type];
    const id = "g" + type + Math.random().toString(36).slice(2, 7);
    const shine = type === "gold"
      ? `<path d="M${cx - r*0.55},${cy - r*0.35} l${r*0.12},${-r*0.25} l${r*0.12},${r*0.25} l${-r*0.12},${r*0.25}z" fill="#fff" opacity=".9"/>`
      : "";
    return `
      <defs>
        <radialGradient id="${id}t" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${p.top}"/><stop offset="1" stop-color="${p.dark}"/></radialGradient>
        <radialGradient id="${id}b" cx="35%" cy="0%" r="90%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9cbe0"/></radialGradient>
      </defs>
      <path d="M${cx - r},${cy} a${r},${r} 0 0 1 ${2*r},0z" fill="url(#${id}t)"/>
      <path d="M${cx - r},${cy} a${r},${r} 0 0 0 ${2*r},0z" fill="url(#${id}b)"/>
      ${type === "great" ? `<path d="M${cx - r*0.62},${cy - r*0.78} q${r*0.25},${r*0.35} ${r*0.1},${r*0.7}" stroke="#e53935" stroke-width="${r*0.18}" fill="none" stroke-linecap="round"/><path d="M${cx + r*0.62},${cy - r*0.78} q${-r*0.25},${r*0.35} ${-r*0.1},${r*0.7}" stroke="#e53935" stroke-width="${r*0.18}" fill="none" stroke-linecap="round"/>` : ""}
      ${shine}
      <rect x="${cx - r}" y="${cy - r*0.08}" width="${2*r}" height="${r*0.16}" fill="#1a1a2e"/>
      <circle cx="${cx}" cy="${cy}" r="${r*0.3}" fill="#1a1a2e"/>
      <circle class="btn-core" cx="${cx}" cy="${cy}" r="${r*0.19}" fill="#fff" stroke="#d0d2e6" stroke-width="${r*0.04}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a1a2e" stroke-width="${r*0.07}"/>`;
  }

  function buildWheel() {
    const R = 195, wheel = document.getElementById("wheel");
    let html = "<defs>" + Object.keys(PRIZES).map(t => `<g id="ball-${t}">${ballSVG(t, 0, 0, 20)}</g>`).join("") + "</defs>";
    SEGMENTS.forEach((type, i) => {
      const a0 = (i * SEG_ANGLE - 90) * Math.PI / 180;
      const a1 = ((i + 1) * SEG_ANGLE - 90) * Math.PI / 180;
      const p = PRIZES[type];
      const fill = p.slice;
      html += `<path d="M0,0 L${R*Math.cos(a0)},${R*Math.sin(a0)} A${R},${R} 0 0 1 ${R*Math.cos(a1)},${R*Math.sin(a1)}z" fill="${fill}" stroke="#ffffff33" stroke-width="1.5"/>`;
      const mid = i * SEG_ANGLE + SEG_ANGLE / 2;
      html += `<use href="#ball-${type}" transform="rotate(${mid}) translate(0,-150) rotate(${-mid})"/>`;
    });
    // pinos na borda
    SEGMENTS.forEach((_, i) => {
      const a = (i * SEG_ANGLE - 90) * Math.PI / 180;
      html += `<circle cx="${188*Math.cos(a)}" cy="${188*Math.sin(a)}" r="4" fill="#fff"/>`;
    });
    wheel.innerHTML = html;
  }

  // Sorteio ponderado com números aleatórios criptográficos
  function drawPrize() {
    const n = crypto.getRandomValues(new Uint32Array(1))[0] / 2**32 * 100;
    let acc = 0;
    for (const [k, p] of Object.entries(PRIZES)) {
      acc += p.chance;
      if (n < acc) return k;
    }
    return "poke";
  }

  // ---------- Sonoplastia: tudo sintetizado com Web Audio, sem arquivos de áudio ----------
  let actx, master, muted = false;
  try { muted = localStorage.getItem("roleta-mudo") === "1"; } catch (e) {}
  const VOLUME = 0.5;

  // Cria o contexto de áudio no primeiro clique (os navegadores exigem um gesto do usuário)
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }

  // Uma nota: freq inicial (Hz), início em segundos a partir de agora, duração
  function tone(freq, at, dur, { type = "sine", gain = 0.2, to } = {}) {
    if (muted) return;
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  const sfx = {
    // estalo do ponteiro em cada pino
    tick() { tone(950, 0, 0.035, { type: "triangle", gain: 0.25, to: 480 }); },
    // sincronizado com as animações "drop" (0,7 s) e "shake" (começa em 0,8 s)
    capture() {
      tone(900, 0, 0.38, { gain: 0.1, to: 220 });                       // queda
      tone(150, 0.385, 0.16, { gain: 0.6, to: 55 });                    // 1º quique
      tone(140, 0.6, 0.12, { gain: 0.35, to: 55 });                     // 2º quique
      tone(130, 0.7, 0.09, { gain: 0.2, to: 55 });                      // 3º quique
      for (const t of [0.908, 1.8, 2.69]) {                             // 3 balançadas
        tone(520, t, 0.09, { type: "square", gain: 0.1, to: 420 });
        tone(430, t + 0.11, 0.09, { type: "square", gain: 0.1, to: 350 });
      }
    },
    // trava + fanfarra (maior quanto mais raro o brinde)
    caught(prize) {
      tone(1800, 0, 0.05, { type: "square", gain: 0.18, to: 600 });
      const notes = { poke: [659, 880], great: [523, 659, 784, 1047], gold: [523, 659, 784, 1047, 1319, 1568] }[prize];
      notes.forEach((f, i) => {
        const last = i === notes.length - 1, t = 0.12 + i * 0.11;
        tone(f, t, last ? 0.6 : 0.2, { type: "triangle", gain: 0.24 });
        if (prize === "gold") tone(f * 2, t, last ? 0.8 : 0.2, { gain: 0.08 });   // brilho
      });
    },
  };

  const muteBtn = document.getElementById("mute");
  function renderMute() { muteBtn.textContent = muted ? "🔇" : "🔊"; muteBtn.setAttribute("aria-pressed", muted); }
  muteBtn.onclick = () => {
    muted = !muted;
    try { localStorage.setItem("roleta-mudo", muted ? "1" : "0"); } catch (e) {}
    if (master) master.gain.value = muted ? 0 : VOLUME;
    renderMute();
  };
  renderMute();

  let rotation = 0, spinning = false, catchTimer;
  const wheel = document.getElementById("wheel");
  const btn = document.getElementById("spin");
  const pointer = document.getElementById("pointer");

  // "tic" do ponteiro: uma única animação reaproveitada, sem forçar reflow
  const TICK_KF = ["0", "-12deg", "0"].map(r => ({ transform: `translateX(-50%) rotate(${r})` }));
  let tickAnim, lastTick = 0;
  function tick(now) {
    if (now - lastTick < 60) return;   // em alta velocidade, no máximo ~16 tics/s
    lastTick = now;
    sfx.tick();
    if (tickAnim) { tickAnim.currentTime = 0; tickAnim.play(); }
    else tickAnim = pointer.animate(TICK_KF, { duration: 120, easing: "ease-out" });
  }

  function spin() {
    if (spinning) return;
    spinning = true; btn.disabled = true;
    wheel.classList.add("spinning");
    audio();   // destrava o áudio dentro do clique

    const prize = drawPrize();
    const options = SEGMENTS.map((t, i) => t === prize ? i : -1).filter(i => i >= 0);
    const seg = options[Math.floor(Math.random() * options.length)];
    const jitter = (Math.random() - 0.5) * SEG_ANGLE * 0.7;
    const center = seg * SEG_ANGLE + SEG_ANGLE / 2 + jitter;
    const current = ((rotation % 360) + 360) % 360;
    const delta = ((360 - center) - current + 720) % 360;
    const start = rotation;
    const target = rotation + 360 * 6 + delta;
    const duration = 5200;
    const t0 = performance.now();
    let lastSeg = -1;

    const ease = t => 1 - Math.pow(1 - t, 4);
    function frame(now) {
      const t = Math.min((now - t0) / duration, 1);
      rotation = start + (target - start) * ease(t);
      wheel.style.transform = `rotate(${rotation}deg)`;
      // "tic" do ponteiro a cada fatia que passa
      const under = Math.floor((((360 - rotation % 360) % 360) / SEG_ANGLE));
      if (under !== lastSeg) {
        lastSeg = under;
        tick(now);
      }
      if (t < 1) requestAnimationFrame(frame);
      else { wheel.classList.remove("spinning"); finish(prize); }
    }
    requestAnimationFrame(frame);
  }

  function finish(prize) {
    const p = PRIZES[prize];
    const card = document.getElementById("result");
    card.classList.remove("caught");
    document.getElementById("resultBall").innerHTML =
      `<div class="ball"><svg viewBox="-55 -55 110 110">${ballSVG(prize)}</svg><i class="core"></i></div><span class="star">★</span><span class="star">★</span><span class="star">★</span>`;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    clearTimeout(catchTimer);
    if (!reduced) sfx.capture();
    catchTimer = setTimeout(() => {
      card.classList.add("caught");
      sfx.caught(prize);
      if (prize !== "poke") confetti(prize === "gold" ? 140 : 50, prize);
      spinning = false; btn.disabled = false;
    }, reduced ? 0 : 3550);
    document.getElementById("resultName").textContent = p.name + "!";
    // número da carta: 1 a 100 (Pokéball/Greatball) ou 1 a 50 (Goldball)
    const card_n = 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 2**32 * p.cards);
    document.getElementById("resultText").innerHTML = `Parabéns, seu brinde é a carta de número <b>${card_n}</b>`;
    card.classList.toggle("gold", prize === "gold");
    document.getElementById("overlay").classList.add("show");
  }

  // Confete num único canvas (antes: até 140 elementos, cada um com sua camada e seu timer)
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  let parts = [], confRaf = 0, dpr = 1, viewH = 0;

  function confetti(n, prize) {
    const colors = prize === "gold" ? ["#f5b400", "#ffe082", "#fff"] : ["#1e88e5", "#90caf9", "#e53935", "#fff"];
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewH = innerHeight;
    cv.width = innerWidth * dpr; cv.height = viewH * dpr;
    cv.hidden = false;
    const now = performance.now();
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * innerWidth,
        color: colors[i % colors.length],
        t0: now + Math.random() * 600,
        dur: 2000 + Math.random() * 2000,
      });
    }
    if (!confRaf) confRaf = requestAnimationFrame(confettiFrame);
  }

  function confettiFrame(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => now - p.t0 < p.dur);
    for (const p of parts) {
      const k = (now - p.t0) / p.dur;
      if (k < 0) continue;
      const a = k * 4 * Math.PI, cos = Math.cos(a) * dpr, sin = Math.sin(a) * dpr;
      ctx.setTransform(cos, sin, -sin, cos, (p.x + 5) * dpr, (k * viewH * 1.1 - 5) * dpr);
      ctx.fillStyle = p.color;
      ctx.fillRect(-5, -7, 10, 14);
    }
    if (parts.length) confRaf = requestAnimationFrame(confettiFrame);
    else { confRaf = 0; cv.hidden = true; }
  }

  function closeResult() { document.getElementById("overlay").classList.remove("show"); }
  btn.onclick = spin;
  document.getElementById("again").onclick = () => { closeResult(); setTimeout(spin, 250); };
  document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay" && !spinning) closeResult(); };

  buildWheel();
</script>
</body>
</html>
